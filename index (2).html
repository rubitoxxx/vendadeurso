<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urso & Cia — ursos de pelúcia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --cream:#FCF7EC;
    --cream-dark:#F3ECDC;
    --cocoa:#3E2E22;
    --cocoa-soft:#6B5644;
    --honey:#E8A33D;
    --honey-dark:#C9821F;
    --teal:#26564A;
    --teal-light:#3C7C6C;
    --blush:#F1C6B8;
    --line:#E3D8C2;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
  *{box-sizing:border-box;}
  body{
    background:var(--cream);
    color:var(--cocoa);
    font-family:'Figtree',ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#211A14; --cream-dark:#2A2119; --cocoa:#F3EADD; --cocoa-soft:#CBB99F;
      --line:#3B2F23; --blush:#5A3B32;
    }
  }
  :root[data-theme="dark"]{
    --cream:#211A14; --cream-dark:#2A2119; --cocoa:#F3EADD; --cocoa-soft:#CBB99F;
    --line:#3B2F23; --blush:#5A3B32;
  }
  .font-display{font-family:'Fraunces',Georgia,'Times New Roman',serif;}
  .btn-primary{
    background:var(--teal); color:#fff; border-radius:999px; font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-primary:hover{background:var(--teal-light); transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-primary:disabled{background:#B9AF9E; cursor:not-allowed; transform:none;}
  .btn-secondary{
    background:transparent; color:var(--cocoa); border:1.5px solid var(--line); border-radius:999px; font-weight:600;
  }
  .btn-secondary:hover{border-color:var(--cocoa-soft);}
  .btn-whatsapp{
    background:#1F6F5C; color:#fff; border-radius:999px; font-weight:700;
  }
  .btn-whatsapp:hover{background:#175A4B;}
  .card{
    background:var(--cream-dark); border:1px solid var(--line); border-radius:22px;
  }
  .chip{
    border:1px solid var(--line); border-radius:999px; padding:.25rem .75rem; font-size:.8rem; color:var(--cocoa-soft);
  }
  .step-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .step-dot.active{background:var(--teal);}
  .step-dot.done{background:var(--honey);}
  input[type=text], input[type=tel], input[type=email], input[type=number], select{
    background:var(--cream); border:1.5px solid var(--line); border-radius:14px; padding:.65rem .9rem;
    width:100%; color:var(--cocoa); font-family:inherit;
  }
  input:focus, select:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
  label{font-size:.82rem; color:var(--cocoa-soft); font-weight:600;}
  .scrollx{overflow-x:auto;}
  a, button{cursor:pointer;}
  ::selection{background:var(--honey); color:#fff;}
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .float-cart{position:fixed; left:0; right:0; bottom:0; z-index:40; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);}
  header{position:sticky; top:0; z-index:50; padding-top:env(safe-area-inset-top,0px);}
</style>
</head>
<body>

<header class="bg-[var(--cream)]/95 backdrop-blur border-b" style="border-color:var(--line)">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="#/" class="flex items-center gap-2 font-display text-xl font-semibold" style="color:var(--cocoa)">
      <svg width="30" height="30" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="22" r="13" fill="var(--honey)"/><circle cx="9" cy="10" r="6" fill="var(--honey)"/><circle cx="31" cy="10" r="6" fill="var(--honey)"/><circle cx="9" cy="10" r="2.6" fill="var(--cocoa)"/><circle cx="31" cy="10" r="2.6" fill="var(--cocoa)"/><circle cx="15.5" cy="20" r="1.8" fill="var(--cocoa)"/><circle cx="24.5" cy="20" r="1.8" fill="var(--cocoa)"/><ellipse cx="20" cy="26" rx="3" ry="2.2" fill="var(--cocoa)"/></svg>
      Urso & Cia
    </a>
    <nav class="hidden sm:flex items-center gap-6 text-sm font-semibold">
      <a href="#/" class="hover:opacity-70">Início</a>
      <a href="#/produtos" class="hover:opacity-70">Produtos</a>
      <a href="#/pedidos" class="hover:opacity-70">Meus pedidos</a>
    </nav>
    <a href="#/carrinho" class="btn-secondary px-4 py-2 text-sm flex items-center gap-2 relative">
      Carrinho
      <span id="cart-badge" class="hidden absolute -top-2 -right-2 bg-[var(--honey)] text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
    </a>
  </div>
  <nav class="sm:hidden flex items-center justify-center gap-6 text-sm font-semibold pb-3">
      <a href="#/">Início</a>
      <a href="#/produtos">Produtos</a>
      <a href="#/pedidos">Meus pedidos</a>
  </nav>
</header>

<main id="app" class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12" style="min-height:70vh"></main>

<footer class="border-t mt-16 py-10 text-center text-sm" style="border-color:var(--line); color:var(--cocoa-soft)">
  <p>Urso & Cia — feito com carinho para a comunidade INTA 🧸</p>
  <p class="mt-1">Fale com a gente: <span style="color:var(--teal)">(45) 98893-7978</span></p>
</footer>

<script>
/* ======================= DADOS ======================= */
const STORE = {
  originCep: "85960-000", // Marechal Cândido Rondon - PR
  whatsapp: "5545988937978",
};

const PRODUCTS = [
  {
    id: "urso-pequeno",
    name: "Urso Pequeno",
    short: "O companheiro de bolso: macio, fofo e do tamanho certo pra levar pra qualquer lugar.",
    description: "Pelúcia macia de 25cm, ideal para presentear ou para manter na mochila. Enchimento antialérgico e acabamento reforçado nas costuras.",
    price: 49.90,
    weight: 0.25, height: 25, width: 15, length: 12,
    stock: 18, active: true, color: "#E8A33D", size: 62,
  },
  {
    id: "urso-medio",
    name: "Urso Médio",
    short: "O favorito da galera: tamanho perfeito para abraçar depois de um dia puxado de aula.",
    description: "Pelúcia de 40cm com acabamento aveludado, ótimo para presentear ou para deixar na cama. Enchimento antialérgico.",
    price: 79.90,
    weight: 0.55, height: 40, width: 26, length: 20,
    stock: 12, active: true, color: "#C9821F", size: 84,
  },
  {
    id: "urso-grande",
    name: "Urso Grande",
    short: "Pra quem quer fazer bonito: um abraço de urso de verdade, do tamanho de um presente inesquecível.",
    description: "Pelúcia gigante de 65cm, super macia e volumosa — perfeita para um presente que ninguém esquece. Enchimento antialérgico premium.",
    price: 119.90,
    weight: 1.1, height: 65, width: 40, length: 32,
    stock: 7, active: true, color: "#8C5A2B", size: 108,
  },
];

/* =============== "CorreiosService" (camada de serviço) ===============
   Estrutura pronta para receber integração real via backend.
   Hoje calcula localmente uma ESTIMATIVA de frete e busca endereço por CEP
   (ViaCEP quando o ambiente permite chamadas externas; senão cai em modo manual).
   Em produção, substituir por chamadas ao backend seguro:
     CORREIOS_API_URL / CORREIOS_API_TOKEN / CEP_API_URL (variáveis de ambiente)
*/
const CorreiosService = {
  async getAddressByCep(cep) {
    const clean = cep.replace(/\D/g, "");
    if (clean.length !== 8) return { ok:false, reason:"cep_invalido" };
    try {
      const res = await fetch(`https://viacep.com.br/ws/${clean}/json/`);
      const data = await res.json();
      if (data.erro) return { ok:false, reason:"cep_nao_encontrado" };
      return { ok:true, street:data.logradouro||"", neighborhood:data.bairro||"", city:data.localidade||"", state:data.uf||"" };
    } catch (e) {
      return { ok:false, reason:"servico_indisponivel" };
    }
  },
  async calculateShipping({ cepDestino, weightKg }) {
    const clean = cepDestino.replace(/\D/g, "");
    if (clean.length !== 8) return { ok:false, reason:"cep_invalido" };
    const originFirst = parseInt(STORE.originCep[0], 10);
    const destFirst = parseInt(clean[0], 10);
    const regionDiff = Math.min(9, Math.abs(originFirst - destFirst));
    const basePac = 12 + weightKg * 9 + regionDiff * 2.4;
    const baseSedex = basePac * 1.55 + 6;
    const daysPac = 4 + regionDiff;
    const daysSedex = Math.max(2, daysPac - 3);
    return {
      ok:true,
      options: [
        { service:"PAC", label:"PAC", price: Math.round(basePac*100)/100, delivery_time: daysPac },
        { service:"SEDEX", label:"SEDEX", price: Math.round(baseSedex*100)/100, delivery_time: daysSedex },
      ]
    };
  },
  trackOrder(code) {
    return { ok:false, reason:"integracao_pendente" };
  }
};

/* ======================= ESTADO / STORAGE ======================= */
const state = {
  cart: JSON.parse(localStorage.getItem("urso_cart") || "[]"),
  orders: JSON.parse(localStorage.getItem("urso_orders") || "[]"),
  checkout: JSON.parse(sessionStorage.getItem("urso_checkout") || "{}"),
};
function saveCart(){ localStorage.setItem("urso_cart", JSON.stringify(state.cart)); updateCartBadge(); }
function saveOrders(){ localStorage.setItem("urso_orders", JSON.stringify(state.orders)); }
function saveCheckout(){ sessionStorage.setItem("urso_checkout", JSON.stringify(state.checkout)); }

function updateCartBadge(){
  const count = state.cart.reduce((s,i)=>s+i.qty,0);
  const badge = document.getElementById("cart-badge");
  if(count>0){ badge.textContent = count; badge.classList.remove("hidden"); }
  else badge.classList.add("hidden");
}

function money(v){ return v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"}); }
function findProduct(id){ return PRODUCTS.find(p=>p.id===id); }

function cartLines(){
  return state.cart.map(item => {
    const p = findProduct(item.id);
    return { ...item, product:p, subtotal: p.price*item.qty };
  }).filter(l=>l.product);
}
function cartTotals(){
  const lines = cartLines();
  const subtotal = lines.reduce((s,l)=>s+l.subtotal,0);
  const weight = lines.reduce((s,l)=>s+l.product.weight*l.qty,0);
  return { lines, subtotal, weight };
}

/* ======================= BEAR SVG ======================= */
function bearSvg(color, size, big){
  const s = big ? 220 : 120;
  return `
  <svg viewBox="0 0 200 200" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="100" cy="180" rx="58" ry="10" fill="#00000012"/>
    <circle cx="46" cy="46" r="26" fill="${color}"/>
    <circle cx="154" cy="46" r="26" fill="${color}"/>
    <circle cx="46" cy="46" r="11" fill="#3E2E22" opacity=".28"/>
    <circle cx="154" cy="46" r="11" fill="#3E2E22" opacity=".28"/>
    <circle cx="100" cy="105" r="72" fill="${color}"/>
    <circle cx="72" cy="98" r="7.5" fill="#3E2E22"/>
    <circle cx="128" cy="98" r="7.5" fill="#3E2E22"/>
    <ellipse cx="100" cy="122" rx="20" ry="15" fill="#FBF3E4"/>
    <ellipse cx="100" cy="116" rx="9" ry="7" fill="#3E2E22"/>
    <path d="M92 128 Q100 136 108 128" stroke="#3E2E22" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="128" r="9" fill="#00000010"/>
    <circle cx="140" cy="128" r="9" fill="#00000010"/>
  </svg>`;
}

/* ======================= ROTEAMENTO ======================= */
function currentRoute(){
  const hash = location.hash.slice(1) || "/";
  const parts = hash.split("/").filter(Boolean);
  return parts;
}
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => { updateCartBadge(); render(); });

function go(path){ location.hash = path; }

function render(){
  const parts = currentRoute();
  const app = document.getElementById("app");
  window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
  if(parts.length===0) app.innerHTML = renderHome();
  else if(parts[0]==="produtos") app.innerHTML = renderProducts();
  else if(parts[0]==="produto" && parts[1]) app.innerHTML = renderProductDetail(parts[1]);
  else if(parts[0]==="carrinho") app.innerHTML = renderCart();
  else if(parts[0]==="checkout") { app.innerHTML = renderCheckout(); mountCheckout(); return; }
  else if(parts[0]==="pedidos") app.innerHTML = renderOrders();
  else if(parts[0]==="pedido" && parts[1]) app.innerHTML = renderOrderDetail(parts[1]);
  else app.innerHTML = renderHome();
  app.classList.add("fade-in");
  setTimeout(()=>app.classList.remove("fade-in"), 400);
  mountPageScripts(parts);
}

/* ======================= HOME ======================= */
function renderHome(){
  const featured = PRODUCTS.filter(p=>p.active).slice(0,3);
  return `
  <section class="grid sm:grid-cols-2 gap-8 items-center mb-16">
    <div>
      <p class="chip inline-block mb-4">Loja da comunidade INTA</p>
      <h1 class="font-display text-4xl sm:text-5xl font-semibold leading-tight" style="color:var(--cocoa)">Encontre seu urso</h1>
      <p class="mt-4 text-base sm:text-lg" style="color:var(--cocoa-soft)">Escolha seu modelo, informe seu CEP e receba em casa. Simples assim.</p>
      <a href="#/produtos" class="btn-primary inline-block mt-6 px-7 py-3.5 text-base">Comprar agora</a>
    </div>
    <div class="flex justify-center">${bearSvg("var(--honey-dark)", 0, true)}</div>
  </section>

  <section>
    <h2 class="font-display text-2xl font-semibold mb-5" style="color:var(--cocoa)">Produtos em destaque</h2>
    <div class="grid sm:grid-cols-3 gap-5">
      ${featured.map(productCard).join("")}
    </div>
  </section>
  `;
}

function productCard(p){
  return `
  <a href="#/produto/${p.id}" class="card p-5 flex flex-col hover:shadow-lg transition-shadow">
    <div class="flex justify-center mb-4">${bearSvg(p.color, p.size)}</div>
    <h3 class="font-display text-lg font-semibold" style="color:var(--cocoa)">${p.name}</h3>
    <p class="text-sm mt-1 flex-1" style="color:var(--cocoa-soft)">${p.short}</p>
    <div class="flex items-center justify-between mt-4">
      <span class="font-display text-xl font-semibold" style="color:var(--teal)">${money(p.price)}</span>
      <span class="btn-primary px-4 py-2 text-sm">Comprar</span>
    </div>
  </a>`;
}

/* ======================= PRODUTOS ======================= */
function renderProducts(){
  return `
  <h1 class="font-display text-3xl font-semibold mb-6" style="color:var(--cocoa)">Nossos ursos</h1>
  <div class="grid sm:grid-cols-3 gap-5">
    ${PRODUCTS.filter(p=>p.active).map(productCard).join("")}
  </div>`;
}

/* ======================= DETALHE DO PRODUTO ======================= */
function renderProductDetail(id){
  const p = findProduct(id);
  if(!p) return `<p>Produto não encontrado. <a href="#/produtos" class="underline">Voltar</a></p>`;
  return `
  <a href="#/produtos" class="text-sm font-semibold" style="color:var(--cocoa-soft)">&larr; Voltar aos produtos</a>
  <div class="grid sm:grid-cols-2 gap-10 mt-4">
    <div class="card flex items-center justify-center py-14">${bearSvg(p.color, 0, true)}</div>
    <div>
      <h1 class="font-display text-3xl font-semibold" style="color:var(--cocoa)">${p.name}</h1>
      <p class="mt-3" style="color:var(--cocoa-soft)">${p.description}</p>
      <p class="font-display text-2xl font-semibold mt-4" style="color:var(--teal)">${money(p.price)}</p>
      <p class="text-sm mt-1" style="color:var(--cocoa-soft)">${p.stock>0 ? `${p.stock} em estoque` : "Sem estoque no momento"}</p>

      <div class="mt-6 flex items-center gap-4">
        <label class="!text-[var(--cocoa)]">Quantidade</label>
        <div class="flex items-center border rounded-full" style="border-color:var(--line)">
          <button id="qty-minus" class="w-9 h-9 text-lg font-bold">−</button>
          <span id="qty-value" class="w-8 text-center font-semibold">1</span>
          <button id="qty-plus" class="w-9 h-9 text-lg font-bold">+</button>
        </div>
      </div>

      <button id="add-to-cart" class="btn-primary w-full sm:w-auto px-7 py-3.5 mt-6 text-base" ${p.stock<=0?"disabled":""}>
        Adicionar ao carrinho
      </button>

      <div class="card p-5 mt-8">
        <h2 class="font-semibold" style="color:var(--cocoa)">Calcule o frete</h2>
        <div class="flex gap-2 mt-3">
          <input type="text" id="cep-input" placeholder="00000-000" maxlength="9" class="flex-1">
          <button id="calc-frete" class="btn-secondary px-5 whitespace-nowrap">Calcular</button>
        </div>
        <div id="frete-result" class="mt-4 space-y-2"></div>
      </div>
    </div>
  </div>`;
}

function mountProductDetail(id){
  const p = findProduct(id);
  if(!p) return;
  let qty = 1;
  const qtyEl = document.getElementById("qty-value");
  document.getElementById("qty-minus").onclick = () => { if(qty>1){ qty--; qtyEl.textContent=qty; } };
  document.getElementById("qty-plus").onclick = () => { if(qty<p.stock){ qty++; qtyEl.textContent=qty; } };
  document.getElementById("add-to-cart").onclick = () => {
    const existing = state.cart.find(i=>i.id===p.id);
    if(existing) existing.qty = Math.min(p.stock, existing.qty + qty);
    else state.cart.push({ id:p.id, qty });
    saveCart();
    const btn = document.getElementById("add-to-cart");
    const original = btn.textContent;
    btn.textContent = "Adicionado ✓";
    setTimeout(()=>{ btn.textContent = original; }, 1200);
  };

  const cepInput = document.getElementById("cep-input");
  cepInput.addEventListener("input", () => {
    let v = cepInput.value.replace(/\D/g,"").slice(0,8);
    if(v.length>5) v = v.slice(0,5)+"-"+v.slice(5);
    cepInput.value = v;
  });

  document.getElementById("calc-frete").onclick = async () => {
    const resultBox = document.getElementById("frete-result");
    const cep = cepInput.value;
    if(cep.replace(/\D/g,"").length!==8){
      resultBox.innerHTML = `<p class="text-sm" style="color:#B4482E">Informe um CEP válido.</p>`;
      return;
    }
    resultBox.innerHTML = `<p class="text-sm" style="color:var(--cocoa-soft)">Calculando…</p>`;
    const res = await CorreiosService.calculateShipping({ cepDestino: cep, weightKg: p.weight*qty });
    if(!res.ok){
      resultBox.innerHTML = `<p class="text-sm" style="color:#B4482E">Não foi possível calcular o frete agora.</p>`;
      return;
    }
    resultBox.innerHTML = res.options.map(o => `
      <div class="flex items-center justify-between border rounded-xl px-4 py-2.5" style="border-color:var(--line)">
        <div>
          <p class="font-semibold text-sm" style="color:var(--cocoa)">${o.label}</p>
          <p class="text-xs" style="color:var(--cocoa-soft)">até ${o.delivery_time} dias úteis</p>
        </div>
        <p class="font-semibold" style="color:var(--teal)">${money(o.price)}</p>
      </div>`).join("");
  };
}

/* ======================= CARRINHO ======================= */
function renderCart(){
  const { lines, subtotal } = cartTotals();
  if(lines.length===0){
    return `
    <div class="text-center py-16">
      <div class="flex justify-center mb-4">${bearSvg("#D8CBB2",0,true)}</div>
      <h1 class="font-display text-2xl font-semibold" style="color:var(--cocoa)">Seu carrinho está vazio</h1>
      <p class="mt-2" style="color:var(--cocoa-soft)">Que tal escolher um urso pra chamar de seu?</p>
      <a href="#/produtos" class="btn-primary inline-block mt-6 px-7 py-3">Ver produtos</a>
    </div>`;
  }
  return `
  <h1 class="font-display text-3xl font-semibold mb-6" style="color:var(--cocoa)">Seu carrinho</h1>
  <div class="space-y-4">
    ${lines.map(l => `
      <div class="card p-4 flex items-center gap-4" data-line="${l.id}">
        <div class="shrink-0">${bearSvg(l.product.color, 64)}</div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold" style="color:var(--cocoa)">${l.product.name}</p>
          <p class="text-sm" style="color:var(--cocoa-soft)">${money(l.product.price)} cada</p>
          <div class="flex items-center border rounded-full w-fit mt-2" style="border-color:var(--line)">
            <button class="qty-minus w-8 h-8 font-bold" data-id="${l.id}">−</button>
            <span class="w-7 text-center font-semibold text-sm">${l.qty}</span>
            <button class="qty-plus w-8 h-8 font-bold" data-id="${l.id}">+</button>
          </div>
        </div>
        <div class="text-right">
          <p class="font-semibold" style="color:var(--teal)">${money(l.subtotal)}</p>
          <button class="remove-line text-xs mt-2 underline" data-id="${l.id}" style="color:var(--cocoa-soft)">Remover</button>
        </div>
      </div>`).join("")}
  </div>

  <div class="card p-5 mt-8 max-w-sm ml-auto">
    <div class="flex justify-between text-sm mb-2" style="color:var(--cocoa-soft)"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    <p class="text-xs" style="color:var(--cocoa-soft)">O frete é calculado no próximo passo.</p>
    <a href="#/checkout" class="btn-primary w-full text-center block mt-4 py-3">Continuar compra</a>
  </div>`;
}

function mountCartScripts(){
  document.querySelectorAll(".qty-plus").forEach(b => b.onclick = () => {
    const item = state.cart.find(i=>i.id===b.dataset.id);
    const p = findProduct(b.dataset.id);
    if(item && item.qty < p.stock){ item.qty++; saveCart(); render(); }
  });
  document.querySelectorAll(".qty-minus").forEach(b => b.onclick = () => {
    const item = state.cart.find(i=>i.id===b.dataset.id);
    if(item){ item.qty--; if(item.qty<=0) state.cart = state.cart.filter(i=>i.id!==b.dataset.id); saveCart(); render(); }
  });
  document.querySelectorAll(".remove-line").forEach(b => b.onclick = () => {
    state.cart = state.cart.filter(i=>i.id!==b.dataset.id); saveCart(); render();
  });
}

/* ======================= CHECKOUT ======================= */
function renderCheckout(){
  const { lines, subtotal, weight } = cartTotals();
  if(lines.length===0){
    return `<p style="color:var(--cocoa-soft)">Seu carrinho está vazio. <a href="#/produtos" class="underline">Ver produtos</a></p>`;
  }
  const step = state.checkout.step || 1;
  return `
  <div class="max-w-xl mx-auto">
    <div class="flex items-center justify-center gap-2 mb-8">
      ${[1,2,3].map(n => `<span class="step-dot ${n===step?'active':(n<step?'done':'')}"></span>`).join("")}
    </div>
    <div id="checkout-step"></div>
  </div>`;
}

function stepAddressHtml(){
  const c = state.checkout.address || {};
  return `
  <h1 class="font-display text-2xl font-semibold mb-1" style="color:var(--cocoa)">Endereço de entrega</h1>
  <p class="text-sm mb-6" style="color:var(--cocoa-soft)">Informe seu CEP para buscarmos o endereço automaticamente.</p>
  <div class="space-y-3">
    <div class="flex gap-2">
      <div class="flex-1"><label>CEP</label><input type="text" id="f-cep" maxlength="9" value="${c.cep||""}" placeholder="00000-000"></div>
      <div class="self-end"><button id="buscar-cep" class="btn-secondary px-4 py-[0.65rem]">Buscar</button></div>
    </div>
    <p id="cep-msg" class="text-xs" style="color:var(--cocoa-soft)"></p>
    <div><label>Rua</label><input type="text" id="f-rua" value="${c.street||""}"></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label>Número</label><input type="text" id="f-numero" value="${c.number||""}"></div>
      <div><label>Complemento</label><input type="text" id="f-comp" value="${c.complement||""}"></div>
    </div>
    <div><label>Bairro</label><input type="text" id="f-bairro" value="${c.neighborhood||""}"></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label>Cidade</label><input type="text" id="f-cidade" value="${c.city||""}"></div>
      <div><label>Estado</label><input type="text" id="f-estado" maxlength="2" value="${c.state||""}"></div>
    </div>
  </div>
  <p id="addr-error" class="text-sm mt-3" style="color:#B4482E"></p>
  <div class="flex gap-3 mt-6">
    <a href="#/carrinho" class="btn-secondary px-6 py-3">Voltar</a>
    <button id="to-frete" class="btn-primary flex-1 py-3">Calcular frete</button>
  </div>`;
}

function stepFreteHtml(){
  const { weight } = cartTotals();
  const chosen = state.checkout.freight;
  return `
  <h1 class="font-display text-2xl font-semibold mb-1" style="color:var(--cocoa)">Frete e entrega</h1>
  <p class="text-sm mb-6" style="color:var(--cocoa-soft)">Escolha a modalidade de entrega para ${state.checkout.address.city}/${state.checkout.address.state}.</p>
  <div id="frete-options" class="space-y-3"></div>
  <div class="flex gap-3 mt-6">
    <button id="back-to-addr" class="btn-secondary px-6 py-3">Voltar</button>
    <button id="to-dados" class="btn-primary flex-1 py-3" ${chosen?"":"disabled"}>Continuar</button>
  </div>`;
}

function stepDadosHtml(){
  const c = state.checkout.customer || {};
  return `
  <h1 class="font-display text-2xl font-semibold mb-1" style="color:var(--cocoa)">Seus dados</h1>
  <p class="text-sm mb-6" style="color:var(--cocoa-soft)">Para prepararmos seu pedido corretamente.</p>
  <div class="space-y-3">
    <div><label>Nome completo</label><input type="text" id="c-nome" value="${c.name||""}"></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label>CPF</label><input type="text" id="c-cpf" value="${c.cpf||""}" placeholder="000.000.000-00"></div>
      <div><label>Telefone</label><input type="tel" id="c-telefone" value="${c.phone||""}" placeholder="(45) 99999-9999"></div>
    </div>
    <div><label>E-mail</label><input type="email" id="c-email" value="${c.email||""}"></div>
  </div>
  <p id="dados-error" class="text-sm mt-3" style="color:#B4482E"></p>
  <div class="flex gap-3 mt-6">
    <button id="back-to-frete" class="btn-secondary px-6 py-3">Voltar</button>
    <button id="to-revisao" class="btn-primary flex-1 py-3">Revisar pedido</button>
  </div>`;
}

function stepRevisaoHtml(){
  const { lines, subtotal } = cartTotals();
  const f = state.checkout.freight;
  const total = subtotal + (f ? f.price : 0);
  const addr = state.checkout.address;
  const cust = state.checkout.customer;
  return `
  <h1 class="font-display text-2xl font-semibold mb-1" style="color:var(--cocoa)">Confira seu pedido</h1>
  <p class="text-sm mb-6" style="color:var(--cocoa-soft)">Revise tudo antes de falar com a gente pelo WhatsApp.</p>

  <div class="card p-5 space-y-2">
    ${lines.map(l => `
      <div class="flex justify-between text-sm">
        <span>${l.product.name} × ${l.qty}</span>
        <span>${money(l.subtotal)}</span>
      </div>`).join("")}
    <div class="border-t pt-2 mt-2 flex justify-between text-sm" style="border-color:var(--line)">
      <span>Frete (${f.label})</span><span>${money(f.price)}</span>
    </div>
    <p class="text-xs" style="color:var(--cocoa-soft)">Prazo estimado: até ${f.delivery_time} dias úteis</p>
    <div class="border-t pt-2 mt-2 flex justify-between font-display text-lg font-semibold" style="border-color:var(--line); color:var(--teal)">
      <span>Total</span><span>${money(total)}</span>
    </div>
  </div>

  <div class="card p-5 mt-4 text-sm space-y-1">
    <p class="font-semibold" style="color:var(--cocoa)">Entrega</p>
    <p>${addr.street}, ${addr.number}${addr.complement?" - "+addr.complement:""}</p>
    <p>${addr.neighborhood} — ${addr.city}/${addr.state} — CEP ${addr.cep}</p>
    <p class="font-semibold mt-2" style="color:var(--cocoa)">Cliente</p>
    <p>${cust.name} · ${cust.phone} · ${cust.email}</p>
  </div>

  <div class="flex gap-3 mt-6">
    <button id="back-to-dados" class="btn-secondary px-6 py-3">Voltar e editar</button>
    <button id="finalizar-whatsapp" class="btn-whatsapp flex-1 py-3.5 text-base">Finalizar pedido pelo WhatsApp</button>
  </div>`;
}

function mountCheckout(){
  if(!state.checkout.step) state.checkout.step = 1;
  if(!state.checkout.address) state.checkout.address = {};
  if(!state.checkout.customer) state.checkout.customer = {};
  renderCheckoutStep();
}

function renderCheckoutStep(){
  const box = document.getElementById("checkout-step");
  if(!box) return;
  const step = state.checkout.step;
  if(step===1){ box.innerHTML = stepAddressHtml(); mountStepAddress(); }
  else if(step===2){ box.innerHTML = stepFreteHtml(); mountStepFrete(); }
  else if(step===3){ box.innerHTML = stepDadosHtml(); mountStepDados(); }
  else if(step===4){ box.innerHTML = stepRevisaoHtml(); mountStepRevisao(); }
  // refresh step dots
  const app = document.getElementById("app");
  app.querySelectorAll(".step-dot").forEach((d,i)=>{
    d.classList.toggle("active", i+1===Math.min(step,3));
    d.classList.toggle("done", i+1<Math.min(step,3));
  });
}

function mountStepAddress(){
  const cepInput = document.getElementById("f-cep");
  cepInput.addEventListener("input", () => {
    let v = cepInput.value.replace(/\D/g,"").slice(0,8);
    if(v.length>5) v = v.slice(0,5)+"-"+v.slice(5);
    cepInput.value = v;
  });
  document.getElementById("buscar-cep").onclick = async () => {
    const msg = document.getElementById("cep-msg");
    const cep = cepInput.value;
    if(cep.replace(/\D/g,"").length!==8){ msg.textContent="CEP inválido."; return; }
    msg.textContent = "Buscando endereço…";
    const res = await CorreiosService.getAddressByCep(cep);
    if(res.ok){
      document.getElementById("f-rua").value = res.street;
      document.getElementById("f-bairro").value = res.neighborhood;
      document.getElementById("f-cidade").value = res.city;
      document.getElementById("f-estado").value = res.state;
      msg.textContent = "Endereço encontrado — confira e complete o número.";
    } else {
      msg.textContent = "Não conseguimos preencher automaticamente — complete o endereço manualmente.";
    }
  };
  document.getElementById("to-frete").onclick = () => {
    const err = document.getElementById("addr-error");
    const address = {
      cep: cepInput.value,
      street: document.getElementById("f-rua").value.trim(),
      number: document.getElementById("f-numero").value.trim(),
      complement: document.getElementById("f-comp").value.trim(),
      neighborhood: document.getElementById("f-bairro").value.trim(),
      city: document.getElementById("f-cidade").value.trim(),
      state: document.getElementById("f-estado").value.trim().toUpperCase(),
    };
    if(address.cep.replace(/\D/g,"").length!==8 || !address.street || !address.number || !address.city || !address.state){
      err.textContent = "Preencha CEP, rua, número, cidade e estado.";
      return;
    }
    state.checkout.address = address;
    state.checkout.freight = null;
    state.checkout.step = 2;
    saveCheckout();
    renderCheckoutStep();
  };
}

function mountStepFrete(){
  const optsBox = document.getElementById("frete-options");
  optsBox.innerHTML = `<p class="text-sm" style="color:var(--cocoa-soft)">Calculando frete…</p>`;
  const { weight } = cartTotals();
  CorreiosService.calculateShipping({ cepDestino: state.checkout.address.cep, weightKg: weight }).then(res => {
    if(!res.ok){ optsBox.innerHTML = `<p class="text-sm" style="color:#B4482E">Não foi possível calcular o frete.</p>`; return; }
    optsBox.innerHTML = res.options.map((o,i) => `
      <label class="card p-4 flex items-center justify-between cursor-pointer" style="border-color:${state.checkout.freight&&state.checkout.freight.service===o.service?'var(--teal)':'var(--line)'}">
        <div class="flex items-center gap-3">
          <input type="radio" name="frete" value="${i}" ${state.checkout.freight&&state.checkout.freight.service===o.service?"checked":""}>
          <div>
            <p class="font-semibold text-sm" style="color:var(--cocoa)">${o.label}</p>
            <p class="text-xs" style="color:var(--cocoa-soft)">até ${o.delivery_time} dias úteis</p>
          </div>
        </div>
        <span class="font-semibold" style="color:var(--teal)">${money(o.price)}</span>
      </label>`).join("");
    optsBox.querySelectorAll('input[name="frete"]').forEach(radio => {
      radio.onchange = () => {
        state.checkout.freight = res.options[parseInt(radio.value)];
        saveCheckout();
        document.getElementById("to-dados").disabled = false;
      };
    });
  });
  document.getElementById("back-to-addr").onclick = () => { state.checkout.step=1; saveCheckout(); renderCheckoutStep(); };
  document.getElementById("to-dados").onclick = () => {
    if(!state.checkout.freight) return;
    state.checkout.step = 3; saveCheckout(); renderCheckoutStep();
  };
}

function mountStepDados(){
  document.getElementById("back-to-frete").onclick = () => { state.checkout.step=2; saveCheckout(); renderCheckoutStep(); };
  document.getElementById("to-revisao").onclick = () => {
    const err = document.getElementById("dados-error");
    const customer = {
      name: document.getElementById("c-nome").value.trim(),
      cpf: document.getElementById("c-cpf").value.trim(),
      phone: document.getElementById("c-telefone").value.trim(),
      email: document.getElementById("c-email").value.trim(),
    };
    if(!customer.name || !customer.cpf || !customer.phone || !customer.email){
      err.textContent = "Preencha todos os campos.";
      return;
    }
    state.checkout.customer = customer;
    state.checkout.step = 4;
    saveCheckout();
    renderCheckoutStep();
  };
}

function mountStepRevisao(){
  document.getElementById("back-to-dados").onclick = () => { state.checkout.step=3; saveCheckout(); renderCheckoutStep(); };
  document.getElementById("finalizar-whatsapp").onclick = () => finalizarPedido();
}

function finalizarPedido(){
  const { lines, subtotal } = cartTotals();
  const f = state.checkout.freight;
  const addr = state.checkout.address;
  const cust = state.checkout.customer;
  if(lines.length===0 || !f || !addr || !cust || !cust.name) return;

  const total = subtotal + f.price;
  const orderId = String(1000 + state.orders.length + 1);

  const order = {
    id: orderId,
    date: new Date().toISOString(),
    status: "Aguardando pagamento",
    items: lines.map(l => ({ name:l.product.name, qty:l.qty, unitPrice:l.product.price, subtotal:l.subtotal })),
    subtotal, freight: f, total, address: addr, customer: cust,
  };
  state.orders.unshift(order);
  saveOrders();

  const msgLines = [
    "Olá! Gostaria de finalizar meu pedido pelo site.",
    "",
    "🧸 PEDIDO — URSO & CIA",
    `Pedido #${orderId}`,
    `👤 Cliente: ${cust.name}`,
    `🧾 CPF: ${cust.cpf}`,
    `📱 Telefone: ${cust.phone}`,
    `📧 E-mail: ${cust.email}`,
    "",
    "📦 PRODUTOS",
    ...order.items.map(i => `🧸 ${i.name}\nQuantidade: ${i.qty}\nValor unitário: ${money(i.unitPrice)}\nSubtotal: ${money(i.subtotal)}`),
    "",
    "🚚 ENTREGA",
    `CEP: ${addr.cep}`,
    `Endereço: ${addr.street}, ${addr.number}${addr.complement?" - "+addr.complement:""}`,
    `Bairro: ${addr.neighborhood}`,
    `Cidade: ${addr.city} - ${addr.state}`,
    `Serviço: ${f.label}`,
    `Prazo estimado: ${f.delivery_time} dias úteis`,
    `Frete: ${money(f.price)}`,
    "",
    "💰 RESUMO",
    `Subtotal: ${money(subtotal)}`,
    `Frete: ${money(f.price)}`,
    `TOTAL: ${money(total)}`,
    "",
    "Gostaria de finalizar a compra e receber as instruções para pagamento.",
  ];
  const text = encodeURIComponent(msgLines.join("\n"));
  const url = `https://wa.me/${STORE.whatsapp}?text=${text}`;

  state.cart = [];
  saveCart();
  state.checkout = {};
  sessionStorage.removeItem("urso_checkout");

  window.open(url, "_blank", "noopener");
  go(`/pedido/${orderId}`);
}

/* ======================= MEUS PEDIDOS ======================= */
const STATUS_COLORS = {
  "Aguardando pagamento":"#C9821F",
  "Pagamento aprovado":"#26564A",
  "Preparando pedido":"#26564A",
  "Enviado":"#3C7C6C",
  "Em trânsito":"#3C7C6C",
  "Entregue":"#1F6F5C",
  "Cancelado":"#B4482E",
};

function renderOrders(){
  if(state.orders.length===0){
    return `
    <div class="text-center py-16">
      <h1 class="font-display text-2xl font-semibold" style="color:var(--cocoa)">Você ainda não tem pedidos</h1>
      <p class="mt-2" style="color:var(--cocoa-soft)">Quando finalizar uma compra, ela aparece aqui.</p>
      <a href="#/produtos" class="btn-primary inline-block mt-6 px-7 py-3">Ver produtos</a>
    </div>`;
  }
  return `
  <h1 class="font-display text-3xl font-semibold mb-6" style="color:var(--cocoa)">Meus pedidos</h1>
  <div class="space-y-4">
    ${state.orders.map(o => `
      <a href="#/pedido/${o.id}" class="card p-5 flex items-center justify-between block">
        <div>
          <p class="font-semibold" style="color:var(--cocoa)">Pedido #${o.id}</p>
          <p class="text-sm" style="color:var(--cocoa-soft)">${new Date(o.date).toLocaleDateString("pt-BR")} · ${money(o.total)}</p>
        </div>
        <span class="chip" style="border-color:${STATUS_COLORS[o.status]}; color:${STATUS_COLORS[o.status]}">${o.status}</span>
      </a>`).join("")}
  </div>`;
}

function renderOrderDetail(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return `<p style="color:var(--cocoa-soft)">Pedido não encontrado. <a href="#/pedidos" class="underline">Meus pedidos</a></p>`;
  return `
  <div class="max-w-lg mx-auto text-center">
    <div class="flex justify-center mb-2">${bearSvg("#1F6F5C",0,false)}</div>
    <h1 class="font-display text-2xl font-semibold" style="color:var(--cocoa)">Pedido realizado com sucesso!</h1>
    <p class="text-sm mt-1" style="color:var(--cocoa-soft)">Pedido #${o.id} · continue no WhatsApp para combinar o pagamento.</p>

    <div class="card p-5 mt-6 text-left space-y-2">
      ${o.items.map(i => `<div class="flex justify-between text-sm"><span>${i.name} × ${i.qty}</span><span>${money(i.subtotal)}</span></div>`).join("")}
      <div class="border-t pt-2 mt-2 flex justify-between text-sm" style="border-color:var(--line)"><span>Frete (${o.freight.label})</span><span>${money(o.freight.price)}</span></div>
      <div class="flex justify-between font-display text-lg font-semibold" style="color:var(--teal)"><span>Total</span><span>${money(o.total)}</span></div>
      <div class="border-t pt-2 mt-2 text-sm" style="border-color:var(--line); color:var(--cocoa-soft)">
        <p>${o.address.street}, ${o.address.number} — ${o.address.city}/${o.address.state}</p>
      </div>
      <div class="mt-2"><span class="chip" style="border-color:${STATUS_COLORS[o.status]}; color:${STATUS_COLORS[o.status]}">${o.status}</span></div>
    </div>

    <div class="flex gap-3 mt-6 justify-center">
      <a href="#/pedidos" class="btn-secondary px-6 py-3">Meus pedidos</a>
      <a href="#/" class="btn-primary px-6 py-3">Voltar para a loja</a>
    </div>
  </div>`;
}

/* ======================= MOUNT ROUTER ======================= */
function mountPageScripts(parts){
  if(parts[0]==="produto" && parts[1]) mountProductDetail(parts[1]);
  else if(parts[0]==="carrinho") mountCartScripts();
}
</script>
